[project]
name = "finale2dorico"
version = "0.1.0"
description = "Convert Finale scores (.musx, .mus) to Dorico projects, and review Dorico projects"
requires-python = ">=3.12"
dependencies = ["doricokit"]

[project.scripts]
f2d = "f2d.__main__:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "f2d"
module-root = ""

[tool.uv.sources]
doricokit = { workspace = true }
